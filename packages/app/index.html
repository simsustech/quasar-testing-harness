<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Quasar Component Playground</title>
  </head>

  <body>
    <script>
      // Apply the quasar-style-* body class before first paint, so the
      // prerendered HTML never paints the preset's unscoped :root defaults
      // (md3) before hydration/app boot. Source of truth: ?style= URL param,
      // falling back to the persisted localStorage choice (set by useStyle
      // via setStyle() or a ?style= param), then md3. Only toggles the
      // quasar-style-* classes so Quasar's own body classes (desktop,
      // body--dark, ...) survive.
      ;(function () {
        // Persisted choice (set by useStyle — via setStyle() or a ?style=
        // param) so a returning visitor gets their style on the very first
        // paint. The URL param wins.
        var style = null
        var m = /(?:[?&])style=(md2|md3|unstyled)(?:&|$)/.exec(
          window.location.search
        )
        if (m) {
          style = m[1]
        } else {
          try {
            var stored = window.localStorage.getItem('quasar-style')
            if (stored === 'md2' || stored === 'md3' || stored === 'unstyled') {
              style = stored
            }
          } catch {
            /* storage unavailable (private mode / blocked) */
          }
        }
        var cls = 'quasar-style-' + (style || 'md3')
        document.body.classList.remove(
          'quasar-style-md2',
          'quasar-style-md3',
          'quasar-style-unstyled'
        )
        document.body.classList.add(cls)
      })()
    </script>
    <div id="app"></div>
  </body>
</html>
